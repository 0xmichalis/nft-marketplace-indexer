version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: saturday
    groups:
      typescript-eslint:
        patterns:
          - "typescript"
          - "typescript-eslint"
          - "@typescript/*"
          - "@typescript-eslint/*"
          - "@types/node"
          - "eslint"
          - "eslint-*"
      graphql:
        patterns:
          - "graphql"
          - "graphql-request"
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: saturday
    groups:
      github-actions:
        patterns:
          - "*"
