name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
  schedule:
    # Rebuild weekly so base image fixes ship without a code change.
    - cron: "47 5 * * 1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node dependencies
        uses: 0xmichalis/repo-tooling/actions/setup-node@ed1b0c7db2764f49a7144c7eff80351a90b65ded # v1.0.0
        with:
          node-version: "24"

      - name: Check pnpm version and lockfile
        run: |
          echo "pnpm version: $(pnpm --version)"
          echo "lockfile version: $(head -1 pnpm-lock.yaml || echo 'No lockfile found')"

      - name: Audit dependencies
        run: pnpm audit

      - name: Format code
        run: pnpm format

      - name: Lint code
        run: pnpm lint

      - name: Generate code from config and schema
        run: pnpm codegen

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

  build-and-push:
    if: github.ref == 'refs/heads/main'
    needs: [build-and-test]
    runs-on: ubuntu-latest
    # Serialize publishing so an older run cannot move latest after a newer one.
    concurrency:
      group: build-and-push
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nft-marketplace-indexer
    steps:
      # This job holds the image signing key, so its actions are pinned.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: docker build --pull -t "$IMAGE_NAME:sha-$GITHUB_SHA" .

      # latest only ever points at a signed digest of main's newest commit.
      - name: Publish signed image
        id: push
        uses: 0xmichalis/repo-tooling/actions/publish-image@ed1b0c7db2764f49a7144c7eff80351a90b65ded # v1.0.0
        with:
          image: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          signing-key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          signing-password: ${{ secrets.COSIGN_PASSWORD }}
          token: ${{ github.token }}
