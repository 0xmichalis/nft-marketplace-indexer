name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
  schedule:
    # Rebuild weekly so base image fixes ship without a code change.
    - cron: "47 5 * * 1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js v24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Check pnpm version and lockfile
        run: |
          echo "pnpm version: $(pnpm --version)"
          echo "lockfile version: $(head -1 pnpm-lock.yaml || echo 'No lockfile found')"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit

      - name: Format code
        run: pnpm format

      - name: Lint code
        run: pnpm lint

      - name: Generate code from config and schema
        run: pnpm codegen

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

  build-and-push:
    if: github.ref == 'refs/heads/main'
    needs: [build-and-test]
    runs-on: ubuntu-latest
    # Serialize publishing so an older run cannot move latest after a newer one.
    concurrency:
      group: build-and-push
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nft-marketplace-indexer
    steps:
      # This job holds the image signing key, so its actions are pinned.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: docker build --pull -t "$IMAGE_NAME:sha-$GITHUB_SHA" .

      - name: Push commit tag
        id: push
        run: |
          set -o pipefail
          digest=$(docker push "$IMAGE_NAME:sha-$GITHUB_SHA" | sed -n 's/^.*digest: \(sha256:[0-9a-f]\{64\}\).*$/\1/p')
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Verifiers use cosign v2, which reads this signature format.
          cosign-release: v2.6.5

      - name: Sign image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes --recursive --key env://COSIGN_PRIVATE_KEY "$IMAGE"
          cosign public-key --key env://COSIGN_PRIVATE_KEY > "$RUNNER_TEMP/cosign.pub"
          cosign verify --key "$RUNNER_TEMP/cosign.pub" "$IMAGE" > /dev/null

      # latest only ever points at a signed digest of main's newest commit.
      - name: Publish latest
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          test -n "$main_sha"
          if [ "$main_sha" != "$GITHUB_SHA" ]; then
            echo "::notice::main has moved past $GITHUB_SHA; leaving latest to the newer run."
            exit 0
          fi
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE_NAME:latest" "$IMAGE"
